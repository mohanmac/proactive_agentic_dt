# Community Cloud: disable file watcher (avoids inotify limit) and use default CORS/XSRF.
# Local dev overrides: start_dashboard.sh passes --server.enableCORS false etc.
[server]
headless = true
fileWatcherType = "none"
# Keep websocket compression OFF (Streamlit default). Community Cloud's reverse
# proxy mishandles large compressed WS frames, so the full dashboard's render
# deltas never reach the browser → blank page. A tiny page can squeak through,
# which is why the earlier Hello-World smoke test looked fine.
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131e33"
textColor = "#e2e8f0"
